services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: network_anomaly_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  kafka:
    image: apache/kafka:3.7.0
    container_name: network_anomaly_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: network_anomaly_timescale
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: network_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - timescale_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: network_anomaly_elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  java-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network_anomaly_java
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
      - kafka
      - timescale
      - elasticsearch
      - ml-service
    environment:
      # These environment variables override your application.yml to use the Docker DNS names instead of localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://timescale:5432/network_assistant
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - APP_ML_SERVICE_URL=http://ml-service:8000

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: network_anomaly_ml
    ports:
      - "8000:8000"

volumes:
  neo4j_data:
  neo4j_logs:
  kafka_data:
  timescale_data:
  es_data:
