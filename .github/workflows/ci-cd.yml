    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}
    # - name: Push Images
    #   run: |
    #     docker tag network-anomaly-java:latest ${{ secrets.DOCKER_USERNAME }}/network-anomaly-java:latest
    #     docker push ${{ secrets.DOCKER_USERNAME }}/network-anomaly-java:latest